spring.application.name=epistemictrace

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

epistemictrace.jwt.secret=${JWT_SECRET}

# Copied into each new activity's sdi_configs row (spec 08). Proposed defaults, see PROJECT.md Q1.
epistemictrace.sdi.defaults.threshold=70
epistemictrace.sdi.defaults.cooldown-seconds=120
epistemictrace.sdi.defaults.window-minutes=5

# A session that ended at most this long ago is resumed instead of replaced (spec 16, Q15).
epistemictrace.session.resume-window=PT30M

epistemictrace.seed.instructor.email=${INSTRUCTOR_SEED_EMAIL:}
epistemictrace.seed.instructor.password=${INSTRUCTOR_SEED_PASSWORD:}
epistemictrace.seed.instructor.name=${INSTRUCTOR_SEED_NAME:}
