spring.application.name=epistemictrace

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

epistemictrace.jwt.secret=${JWT_SECRET}

# SDI formula (spec 20, Q1 accepted 2026-10-31): signal weights (sum 1), normalization caps, LOW/MEDIUM boundary.
epistemictrace.sdi.weights.run-frequency=0.20
epistemictrace.sdi.weights.edit-to-run=0.20
epistemictrace.sdi.weights.repeated-errors=0.25
epistemictrace.sdi.weights.no-progress=0.35
epistemictrace.sdi.caps.run-count=10
epistemictrace.sdi.caps.gap=60s
epistemictrace.sdi.caps.repeats=5
epistemictrace.sdi.levels.medium-from=40

# Copied into each new activity's sdi_configs row (spec 08). Q1: threshold 70, 10-minute cooldown, 5-minute window.
epistemictrace.sdi.defaults.threshold=70
epistemictrace.sdi.defaults.cooldown-seconds=600
epistemictrace.sdi.defaults.window-minutes=5

# Reflection fields, in characters after trimming (Q8; specs 22 and 24).
epistemictrace.reflection.min-length=20
epistemictrace.reflection.max-length=2000

# A session that ended at most this long ago is resumed instead of replaced (spec 16, Q15).
epistemictrace.session.resume-window=PT30M

epistemictrace.seed.instructor.email=${INSTRUCTOR_SEED_EMAIL:}
epistemictrace.seed.instructor.password=${INSTRUCTOR_SEED_PASSWORD:}
epistemictrace.seed.instructor.name=${INSTRUCTOR_SEED_NAME:}
