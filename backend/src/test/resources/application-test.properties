spring.datasource.url=jdbc:h2:mem:epistemictrace;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Fake secret for tests only (32+ bytes). Never use it outside tests.
epistemictrace.jwt.secret=test-only-fake-jwt-secret-0123456789abcdef

# Tests never seed from the developer's INSTRUCTOR_SEED_* variables; seeder tests set these values themselves.
epistemictrace.seed.instructor.email=
epistemictrace.seed.instructor.password=
epistemictrace.seed.instructor.name=
